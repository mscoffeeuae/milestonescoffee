# ============================================================================
# Milestones Coffee 2.0 — Production Docker Compose
# ============================================================================
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# REQUIRED ENVIRONMENT FILE: .env.production (never committed — see .env.example)
#
# NOTES:
#   - Infrastructure (postgres, redis) uses the base docker-compose.yml
#   - Application images are pre-built by CI and pushed to your registry
#   - Replace IMAGE_REGISTRY placeholder with your actual registry (e.g., ghcr.io/your-org)
#   - All secrets must be provided via environment variables — no defaults here
# ============================================================================

version: "3.9"

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SENTRY_DSN: ${SENTRY_DSN}

services:
  # ── API ───────────────────────────────────────────────────────────────────
  api:
    image: ${IMAGE_REGISTRY}/milestones/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s

  # ── Worker ────────────────────────────────────────────────────────────────
  worker:
    image: ${IMAGE_REGISTRY}/milestones/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *common-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s

  # ── Web (Customer Site) ───────────────────────────────────────────────────
  web:
    image: ${IMAGE_REGISTRY}/milestones/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
      NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Admin Dashboard ───────────────────────────────────────────────────────
  admin:
    image: ${IMAGE_REGISTRY}/milestones/admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "3001"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Sanity Studio ─────────────────────────────────────────────────────────
  studio:
    image: ${IMAGE_REGISTRY}/milestones/studio:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "3333"
      SANITY_STUDIO_API_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
      SANITY_STUDIO_API_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-production}
    ports:
      - "3333:3333"

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  # NOTE: Replace with your actual reverse proxy (nginx, Caddy, Traefik, etc.)
  # This placeholder is for reference only — configure TLS termination externally.

# Extends base infrastructure services (postgres + redis) from docker-compose.yml
# No new volumes defined here — base file owns them
